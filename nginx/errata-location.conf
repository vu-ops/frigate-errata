# Errata review UI behind the existing reverse proxy.
# Paste this inside the HTTPS server block of your nginx configuration,
# next to the Frigate `location /` block.
#
# The app is prefix-aware: it serves its own routes under /errata/, so
# nginx passes the full path through unchanged (no URI on proxy_pass).

        location = /errata {
            return 308 /errata/;
        }

        location /errata/ {
            set $errata_upstream http://errata:8501;
            proxy_pass $errata_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;

            proxy_buffering off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
