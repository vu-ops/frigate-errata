frigate:
  api_url: "http://frigate:5000"
  username: "${ERRATA_FRIGATE_USER:-}"
  password: "${ERRATA_FRIGATE_PASSWORD:-}"
  snapshot_dir: "/data/snapshots"
  config_path: ""
  backup_dir: "/data/frigate-config-backups"
  published_model_prefix: "/config/models/published"

harvest:
  interval_minutes: 30
  lookback_hours: 24
  min_confidence: 0.50
  max_confidence: 0.95
  max_events_per_run: 500
  max_pages: 20

analysis:
  vocabulary_coherence: true
  low_confidence_threshold: 0.75
  confirm_on_coherent_description: true
  safe_labels:                      # common labels; a description that does not
    - person                        # confirm them is still flagged (so persistent
    - car                           # false positives surface), just at lower
    - truck                         # priority than other mismatches
