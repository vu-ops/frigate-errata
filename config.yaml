frigate:
  api_url: "http://frigate:5000"
  username: "${ERRATA_FRIGATE_USER:-}"
  password: "${ERRATA_FRIGATE_PASSWORD:-}"
  snapshot_dir: "/data/snapshots"
  config_path: ""
  backup_dir: "/data/frigate-config-backups"
  backup_keep: 5                    # keep the N most recent Frigate config
                                    # backups (files + DB rows); older ones are
                                    # pruned whenever a new backup is written
  published_model_prefix: "/config/models/published"

harvest:
  interval_minutes: 30
  lookback_hours: 24
  min_confidence: 0.50
  max_confidence: 0.95
  max_events_per_run: 500
  max_pages: 20

analysis:
  vocabulary_coherence: true
  low_confidence_threshold: 0.75
  confirm_on_coherent_description: true
  auto_skip_implausible_boxes: true   # detector boxes that fail is_plausible_box
                                      # (full-width slivers anchored on the frame
                                      # edge) are artifacts: auto-skip them so they
                                      # never reach the review queue or training
  oversized_box:                      # boxes covering more than max_area of the
    enabled: true                     # frame (merged detections, e.g. two cars
    max_area: 0.4                     # under one box in IR night frames) are
                                      # flagged for review instead of being
                                      # auto-confirmed; they are also excluded
                                      # from training pseudo-labels
  safe_labels:                      # common labels; a description that does not
    - person                        # confirm them is still flagged (so persistent
    - car                           # false positives surface), just at lower
    - truck                         # priority than other mismatches
    - bicycle
