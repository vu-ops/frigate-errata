training:
  trigger_threshold: 50
  enabled: true
  dataset_dir: "/data/dataset"
  model_output_dir: "/data/models"
  publish_dir: "/publish"
  keep_versions: 20
  model_type: "yolo11n"
  epochs: 100
  imgsz: 640
  batch: 16
  amp: false
  workers: 4
  device: "xpu"                    # xpu (Intel) | cuda (NVIDIA) | rocm (AMD) | cpu
  val_split: 0.1
  region_crops: true
  auto_update_frigate_config: false
  pseudo_labels:
    enabled: true
    per_camera_label_day: 10
    max_per_class: 500

notifications:
  enabled: false
  discord_webhook: ""

server:
  listen_host: "0.0.0.0"
  listen_port: 8501
  base_path: "/errata"

database:
  path: "/data/errata.db"

logging:
  level: "INFO"
