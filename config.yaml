# Errata user configuration.
#
# The container ships a full baseline at errata/settings.yaml (object classes,
# brand attributes, synonyms, per-label control defaults, and every tunable).
# This file is layered on top of it, so you only need to list what you change.
#
# NOTE: for synonym lists the baseline is preserved and your entries are
# APPENDED (deduped) -- you cannot remove packaged synonyms here.

frigate:
  api_url: "http://frigate:5000"
  username: "${ERRATA_FRIGATE_USER:-}"
  password: "${ERRATA_FRIGATE_PASSWORD:-}"
  snapshot_dir: "/data/snapshots"
  backup_dir: "/data/frigate-config-backups"
  backup_keep: 5
  published_model_prefix: "/config/models/published"

# 0 = train going forward only (no historical backfill on a fresh start).
harvest:
  lookback_hours: 0

review:
  auto_keep_per_label: 500
  queue_limit: 200

training:
  device: "xpu"                    # xpu (Intel) | cuda (NVIDIA) | rocm (AMD) | cpu
  model_type: "yolov9s"
  imgsz: 320
  pseudo_labels:
    enabled: true
    per_camera_label_day: 25
    max_per_class: 500

server:
  listen_host: "0.0.0.0"
  listen_port: 8501
  base_path: "/errata"

database:
  path: "/data/errata.db"

logging:
  level: "INFO"
