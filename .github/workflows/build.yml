name: Build container

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # Heavy, rarely-changing runtime (stock Python + GPU stack + torch/ultralytics).
  # Built once and published to GHCR, then reused by every app build. The tag is
  # driven by BASE_VERSION; bump that file to force a rebuild. If the tag already
  # exists this job is a cheap no-op.
  base:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve base image reference
        id: meta
        run: |
          V="$(tr -d '[:space:]' < BASE_VERSION)"
          echo "image=${IMAGE_BASE}-base-xpu:${V}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether base image already exists
        id: check
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base (xpu)
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          build-args: |
            GPU_TYPE=xpu
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_BASE }}-base-xpu:latest
          cache-from: type=gha,scope=base-xpu
          cache-to: type=gha,mode=max,scope=base-xpu

  # Thin app image: FROM the base above, adds app deps + code. Per-commit delta
  # is a few tens of MB, so this builds in seconds.
  build-xpu:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BASE="$(echo "$VERSION" | cut -d. -f1,2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (xpu)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            BASE_IMAGE=${{ needs.base.outputs.image }}
          tags: |
            ${{ env.IMAGE_BASE }}-xpu:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_BASE }}-xpu:latest
          cache-from: type=gha,scope=errata
          cache-to: type=gha,mode=max,scope=errata
