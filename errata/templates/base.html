<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Errata{% endblock %}</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f1115; color: #e6e6e6; }
header { display: flex; gap: 1.5rem; align-items: center; padding: 0.75rem 1.25rem; background: #161a22; border-bottom: 1px solid #232833; }
header a { color: #9fb4ff; text-decoration: none; font-weight: 600; }
header .brand { color: #fff; font-size: 1.05rem; letter-spacing: 0.02em; }
header .version { color: #6b7488; font-size: 0.78rem; font-weight: 600; margin-left: -1rem; }
header button.running { background: #243044; border-color: #3a4152; color: #9ec1ff; cursor: default; }
main { padding: 1.25rem; max-width: 1400px; margin: 0 auto; }
a { color: #9fb4ff; }
.msg { background: #1d2b1f; border: 1px solid #2f5233; padding: 0.5rem 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
.filters form { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1rem; }
.filters label { display: flex; flex-direction: column; font-size: 0.72rem; color: #8a93a6; gap: 0.25rem; text-transform: uppercase; letter-spacing: 0.04em; }
select, button, input { background: #1b2130; color: #e6e6e6; border: 1px solid #2b3347; border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.9rem; }
button { cursor: pointer; }
button:hover { filter: brightness(1.15); }
button.primary { background: #2f6feb; border-color: #2f6feb; color: #fff; font-weight: 600; }
button.warn { background: #7a2e2e; border-color: #8f3b3b; color: #fff; }
.grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
.card { background: #161a22; border: 1px solid #232833; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.card img { width: 100%; height: auto; display: block; background: #0a0c10; }
.card .body { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
.meta { font-size: 0.8rem; color: #8a93a6; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.badge { padding: 0.1rem 0.5rem; border-radius: 99px; font-size: 0.72rem; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.badge.mismatch { background: #4a1f1f; color: #ff9d9d; border-color: #7a2e2e; }
.badge.low_confidence { background: #46351a; color: #ffd58a; border-color: #6d5424; }
.badge.noise { background: #1c3350; color: #9ec1ff; border-color: #2b4a73; }
.badge.oversized { background: #46321c; color: #ffc49d; border-color: #7a4a2e; }
.badge.suggest { background: #3d2b4f; color: #d0b3ff; border-color: #5c4273; }
.badge.status { background: #2b2f3a; color: #c9d1e0; border-color: #3a4152; }
.badge.corrected { background: #1d2b22; color: #a8e6b8; border-color: #2f5233; }
.quick { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.quick form { margin: 0; }
.chip { border-radius: 99px; font-size: 0.8rem; font-weight: 600; padding: 0.25rem 0.75rem; }
.chip.detected { background: #20303f; color: #a8d3ff; border: 1px solid #2e4a63; }
.chip.suggest { background: #3d2b4f; color: #d0b3ff; border: 1px solid #5c4273; }
.chip.edit { background: #3a2f1c; color: #ffc49d; border: 1px solid #6d5424; }
.badge.label { background: #20303f; color: #a8d3ff; border-color: #2e4a63; }
.badge.camera { background: #1d2b22; color: #a8e6b8; border-color: #2f5233; }
.desc { font-size: 0.9rem; margin: 0; color: #c9d1e0; flex: 1; line-height: 1.4; }
.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.actions select { flex: 1; min-width: 9rem; }
table { border-collapse: collapse; width: 100%; margin: 0.5rem 0 1.5rem; }
th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid #232833; font-size: 0.9rem; }
th { color: #8a93a6; font-weight: 600; }
td.n { text-align: right; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.stat { background: #161a22; border: 1px solid #232833; border-radius: 10px; padding: 0.9rem; }
.stat .n { font-size: 1.6rem; font-weight: 700; color: #fff; }
.stat .t { font-size: 0.72rem; color: #8a93a6; text-transform: uppercase; letter-spacing: 0.05em; }
.empty { color: #8a93a6; padding: 2.5rem; text-align: center; border: 1px dashed #232833; border-radius: 10px; }
.section-title { font-size: 0.85rem; color: #8a93a6; text-transform: uppercase; letter-spacing: 0.06em; margin: 1.5rem 0 0.25rem; }
.msg.hint { line-height: 1.5; font-size: 0.88rem; }
table input { width: 100%; }
table td { vertical-align: middle; }
table td.k { width: 11rem; white-space: nowrap; }
img.zoom { cursor: zoom-in; }
#lightbox { position: fixed; inset: 0; background: rgba(5, 7, 10, 0.92); display: flex; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
#lightbox[hidden] { display: none; }
#lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,.8); }
.progress { background: #1b2130; border: 1px solid #2b3347; border-radius: 99px; height: 12px; overflow: hidden; margin: 0.5rem 0 1.5rem; max-width: 480px; }
.progress .fill { background: #2f6feb; height: 100%; }
details { margin-top: 0.35rem; }
details summary { cursor: pointer; color: #9fb4ff; font-size: 0.8rem; }
details table { margin: 0.4rem 0 0.2rem; }
#boxeditor { position: fixed; inset: 0; background: rgba(5, 7, 10, 0.92); display: flex; align-items: center; justify-content: center; z-index: 110; }
#boxeditor[hidden] { display: none; }
.be-panel { background: #161a22; border: 1px solid #232833; border-radius: 10px; padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; max-width: 96vw; max-height: 96vh; }
.be-head { font-size: 0.85rem; color: #c9d1e0; }
.be-stage { position: relative; user-select: none; touch-action: none; cursor: crosshair; align-self: center; line-height: 0; }
.be-stage img { display: block; max-width: 92vw; max-height: 70vh; }
.be-box { position: absolute; border: 2px solid #00dcff; background: rgba(0, 220, 255, 0.08); box-sizing: border-box; cursor: move; }
.be-box[hidden] { display: none; }
.be-h { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #00dcff; border: 1px solid #0a0c10; border-radius: 2px; }
.be-h[data-dir="nw"] { left: 0; top: 0; cursor: nwse-resize; }
.be-h[data-dir="n"] { left: 50%; top: 0; cursor: ns-resize; }
.be-h[data-dir="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
.be-h[data-dir="e"] { left: 100%; top: 50%; cursor: ew-resize; }
.be-h[data-dir="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
.be-h[data-dir="s"] { left: 50%; top: 100%; cursor: ns-resize; }
.be-h[data-dir="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
.be-h[data-dir="w"] { left: 0; top: 50%; cursor: ew-resize; }
.be-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.be-actions select { min-width: 9rem; }
</style>
</head>
<body>
<header>
  <span class="brand">Errata</span>
  <span class="version" title="container version">v{{ app_version }}</span>
  <a href="{{ base }}/">Review queue</a>
  <a href="{{ base }}/summary">Summary</a>
  <a href="{{ base }}/synonyms">Synonyms</a>
  <a href="{{ base }}/api/queue.json">Export JSON</a>
  <a href="{{ base }}/api/train/mac-kit.zip">Mac kit</a>
  <button id="run-now" title="Fetch new events from Frigate and analyze them" onclick="runNow(this)">Fetch latest</button>
  <button id="train-btn" title="Retrain the model on CPU with collected corrections" onclick="startTrain(this)">Train</button>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div id="lightbox" hidden><img id="lightbox-img" alt="snapshot preview"></div>
<div id="boxeditor" hidden>
  <div class="be-panel">
    <div class="be-head">Adjust the training box — drag the box to move it, drag a corner/edge handle to resize, or drag on empty image space to draw a new box. The saved box is what the model learns from.</div>
    <div class="be-stage" id="be-stage">
      <img id="be-img" alt="clean snapshot">
      <div class="be-box" id="be-box" hidden>
        <span class="be-h" data-dir="nw"></span><span class="be-h" data-dir="n"></span><span class="be-h" data-dir="ne"></span><span class="be-h" data-dir="e"></span><span class="be-h" data-dir="se"></span><span class="be-h" data-dir="s"></span><span class="be-h" data-dir="sw"></span><span class="be-h" data-dir="w"></span>
      </div>
    </div>
    <form id="be-form" method="post" class="be-actions">
      <input type="hidden" name="action" value="confirm">
      <input type="hidden" name="box" id="be-box-input">
      <input type="hidden" name="return_to" id="be-return-to">
      <label>Label <select name="label" id="be-label"></select></label>
      <button class="primary" type="submit">Save correction</button>
      <button class="warn" type="button" id="be-fp">Save as false positive</button>
      <button type="button" id="be-cancel">Cancel</button>
    </form>
  </div>
</div>
<script>
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
function openLightbox(src) { lightboxImg.src = src; lightbox.hidden = false; }
function closeLightbox() { lightbox.hidden = true; lightboxImg.src = ''; }
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
async function runNow(btn) {
  btn.disabled = true;
  btn.textContent = 'Running…';
  try {
    await fetch('{{ base }}/api/run-now', { method: 'POST' });
    await new Promise(r => setTimeout(r, 1500));
    location.reload();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Fetch latest';
  }
}
var trainBtn = document.getElementById('train-btn');
var trainBtnTitle = trainBtn ? trainBtn.title : '';
var trainPoll = null;
var sawRunning = false;
function trainLabel(s) {
  if (s.phase === 'exporting dataset') return 'Exporting dataset…';
  if (s.phase === 'export' || s.phase === 'publish') return 'Publishing…';
  if (s.epochs) return 'Training ' + (s.epoch || 0) + '/' + s.epochs;
  return 'Training…';
}
function trainDetail(s) {
  var parts = [];
  if (s.epochs) parts.push('epoch ' + (s.epoch || 0) + '/' + s.epochs + ' (' + Math.round((s.progress || 0) * 100) + '%)');
  var m = s.metrics || {};
  if (m.mAP50 != null) parts.push('mAP50 ' + m.mAP50);
  if (m.box_loss != null) parts.push('box ' + m.box_loss);
  if (m.cls_loss != null) parts.push('cls ' + m.cls_loss);
  if (m.dfl_loss != null) parts.push('dfl ' + m.dfl_loss);
  if (!parts.length) parts.push(s.detail || '');
  return parts.join(' · ');
}
function showTraining(s) {
  if (trainBtn) {
    trainBtn.disabled = true;
    trainBtn.classList.add('running');
    trainBtn.textContent = trainLabel(s);
    trainBtn.title = trainDetail(s);
  }
  var live = document.getElementById('train-live');
  if (live) live.textContent = trainDetail(s);
}
function resetTraining() {
  if (trainBtn) {
    trainBtn.disabled = false;
    trainBtn.classList.remove('running');
    trainBtn.textContent = 'Train';
    trainBtn.title = trainBtnTitle;
  }
}
function ensureTrainPoll() {
  if (!trainPoll) trainPoll = setInterval(refreshTrainState, 3000);
}
async function refreshTrainState() {
  var s;
  try { s = await (await fetch('{{ base }}/api/train/status')).json(); }
  catch (e) { return; }
  if (s.running) { sawRunning = true; showTraining(s); return; }
  if (trainPoll) { clearInterval(trainPoll); trainPoll = null; }
  if (sawRunning) { location.reload(); return; }
  resetTraining();
}
async function startTrain(btn) {
  if (btn.disabled) return;
  if (!confirm('Start a training run now?')) return;
  btn.disabled = true;
  btn.textContent = 'Training…';
  try {
    const r = await fetch('{{ base }}/api/train', { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      alert('Could not start training: ' + (j.detail || r.status));
      resetTraining();
      return;
    }
    sawRunning = true;
    showTraining({ phase: 'starting' });
    ensureTrainPoll();
  } catch (err) {
    resetTraining();
  }
}
(async function initTrainState() {
  try {
    const s = await (await fetch('{{ base }}/api/train/status')).json();
    if (s.running) { sawRunning = true; showTraining(s); ensureTrainPoll(); }
  } catch (e) {}
})();

(function initBoxEditor() {
  const BASE = '{{ base }}';
  const LABELS = {{ (labels if labels is defined else []) | tojson }};
  const editor = document.getElementById('boxeditor');
  if (!editor) return;
  const stage = document.getElementById('be-stage');
  const img = document.getElementById('be-img');
  const boxEl = document.getElementById('be-box');
  const boxInput = document.getElementById('be-box-input');
  const form = document.getElementById('be-form');
  const labelSel = document.getElementById('be-label');
  const returnInput = document.getElementById('be-return-to');
  const actionInput = form.querySelector('input[name="action"]');
  const MIN = 0.01;
  let box = null, mode = null, start = null;

  function clampBox(b) {
    const x = Math.min(Math.max(b.x, 0), 1);
    const y = Math.min(Math.max(b.y, 0), 1);
    const w = Math.min(Math.max(b.w, 0), 1 - x);
    const h = Math.min(Math.max(b.h, 0), 1 - y);
    return { x: x, y: y, w: w, h: h };
  }
  function draw() {
    const r = img.getBoundingClientRect();
    if (!box || box.w <= 0 || box.h <= 0 || !r.width || !r.height) { boxEl.hidden = true; return; }
    boxEl.hidden = false;
    boxEl.style.left = (box.x * r.width) + 'px';
    boxEl.style.top = (box.y * r.height) + 'px';
    boxEl.style.width = (box.w * r.width) + 'px';
    boxEl.style.height = (box.h * r.height) + 'px';
  }
  function rel(e) {
    const r = img.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  }
  function close() { editor.hidden = true; img.src = ''; box = null; mode = null; start = null; }
  function open(btn) {
    box = null;
    const raw = btn.dataset.box || '';
    if (raw) {
      try {
        const b = JSON.parse(raw);
        if (b && b.length === 4) box = { x: +b[0], y: +b[1], w: +b[2], h: +b[3] };
      } catch (e) {}
    }
    labelSel.innerHTML = '';
    const wanted = btn.dataset.defaultLabel || btn.dataset.label || '';
    const list = LABELS.slice();
    if (btn.dataset.label && list.indexOf(btn.dataset.label) < 0) list.push(btn.dataset.label);
    list.forEach(function (l) {
      const o = document.createElement('option');
      o.value = l; o.textContent = l;
      if (l === wanted) o.selected = true;
      labelSel.appendChild(o);
    });
    form.action = BASE + '/review/' + btn.dataset.event;
    returnInput.value = btn.dataset.returnTo || '';
    img.onload = draw;
    img.src = BASE + '/api/snapshots/' + btn.dataset.event + '/clean.jpg';
    editor.hidden = false;
    draw();
  }
  window.openBoxEditor = open;
  window.closeBoxEditor = close;

  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    const p = rel(e);
    if (e.target.classList && e.target.classList.contains('be-h')) {
      mode = e.target.dataset.dir;
    } else if (boxEl.contains(e.target)) {
      mode = 'move';
    } else {
      box = { x: p.x, y: p.y, w: 0, h: 0 };
      mode = 'se';
      draw();
    }
    start = { x: p.x, y: p.y, box: Object.assign({}, box) };
    stage.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!mode || !start) return;
    const p = rel(e), s = start.box;
    let b;
    if (mode === 'move') {
      b = { x: s.x + (p.x - start.x), y: s.y + (p.y - start.y), w: s.w, h: s.h };
    } else {
      const x1 = s.x, y1 = s.y, x2 = s.x + s.w, y2 = s.y + s.h;
      let nx1 = x1, ny1 = y1, nx2 = x2, ny2 = y2;
      if (mode.indexOf('w') >= 0) nx1 = p.x;
      if (mode.indexOf('e') >= 0) nx2 = p.x;
      if (mode.indexOf('n') >= 0) ny1 = p.y;
      if (mode.indexOf('s') >= 0) ny2 = p.y;
      b = { x: Math.min(nx1, nx2), y: Math.min(ny1, ny2), w: Math.abs(nx2 - nx1), h: Math.abs(ny2 - ny1) };
    }
    box = clampBox(b);
    draw();
  });
  function endDrag() { mode = null; start = null; }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  function commit(action) {
    if (!box || box.w < MIN || box.h < MIN) {
      alert('Draw a box on the image first.');
      return false;
    }
    boxInput.value = JSON.stringify([+box.x.toFixed(6), +box.y.toFixed(6), +box.w.toFixed(6), +box.h.toFixed(6)]);
    actionInput.value = action;
    return true;
  }
  form.addEventListener('submit', function (e) { if (!commit('confirm')) e.preventDefault(); });
  document.getElementById('be-fp').addEventListener('click', function () {
    if (commit('false_positive')) form.submit();
  });
  document.getElementById('be-cancel').addEventListener('click', close);
  editor.addEventListener('click', function (e) { if (e.target === editor) close(); });
  window.addEventListener('resize', draw);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !editor.hidden) close(); });
})();

</script>
</body>
</html>
