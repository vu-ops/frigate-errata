review:
  auto_keep_per_label: 150
  queue_limit: 200
  # Review-preview crop: show wider context than the training crop (~scale x
  # the object's larger side), rendered at preview_imgsz px.
  preview_scale: 1.33
  preview_imgsz: 640
  # Ignored events (incl. events of labels set to collect_mode: off) are kept
  # this many hours after they were ignored, then deleted with their snapshots.
  # 0 keeps them forever.
  keep_ignored_hours: 24
  # Events rendered per page in the review grid.
  page_size: 100
  # "GenAI Help": send a snapshot to OpenRouter for a second opinion (label,
  # description, optional bounding box). Auto-enabled when api_key is set.
  genai_help:
    enabled: true
    api_key: "${OPENROUTER_API_KEY:-}"
    base_url: "https://openrouter.ai/api/v1"
    timeout: 60
    max_image_px: 1280
    default_model: "~google/gemini-flash-latest"
    models:
      - name: "Gemini Flash (latest)"
        id: "~google/gemini-flash-latest"
      - name: "Qwen Flash (latest)"
        id: "qwen/qwen3.8-flash"
notifications:
  enabled: false
  discord_webhook: ''
labels:
  # Object detector classes only. Brand labels (usps/ups/fedex/...) and
  # license_plate are NOT classes -- they are attributes (see `attributes`).
  # Order defines YOLO class indices and labels.txt order.
  track:
  - car
  - cat
  - dog
  - person
  - deer
  - horse
  - fox
  - coyote
  - rabbit
  - raccoon
  - bird
  - possum
  - skunk
  - squirrel
  - rodent
  - package
  - garbage_truck
  - boat
  - delivery_truck
  # Brand/attribute tags. Metadata only: reviewed as a separate queue item and
  # never trained as a detector class. Populated from Frigate attributes.
  attributes:
  - usps
  - ups
  - fedex
  - amazon
  - dhl
  - gls
  # Per-label control defaults. Empty means built-in defaults apply (see
  # controls.defaults below); a reset switches everything to disabled.
  controls:
    defaults:
      collect_mode: all
      search: false
      include_training: true
      auto_confirm: true
      pseudo_labels: true
    reset_disabled: true
training:
  enabled: true
  trigger_threshold: 50
  dataset_dir: /data/dataset
  model_output_dir: /data/models
  publish_dir: /publish
  base_dir: /data/base
  keep_versions: 20
  model_type: yolov9s
  epochs: 100
  imgsz: 320
  batch: 16
  amp: false
  workers: 4
  device: cpu
  val_split: 0.1
  region_crops: true
  auto_update_frigate_config: false
  pseudo_labels:
    enabled: true
    per_camera_label_day: 3
    max_per_class: 250
server:
  listen_host: 0.0.0.0
  listen_port: 8501
  base_path: /errata
logging:
  level: INFO
