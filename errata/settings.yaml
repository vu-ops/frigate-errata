frigate:
  api_url: http://frigate:5000
  username: ''
  password: ''
  request_timeout: 30
  snapshot_dir: /data/snapshots
  config_path: ''
  backup_keep: 5
harvest:
  interval_minutes: 30
  # 0 = train going forward only: the first run starts at "now" and never
  # backfills history. Set >0 to opt into a one-time historical lookback.
  lookback_hours: 0
  min_confidence: 0.5
  max_confidence: 0.95
  max_events_per_run: 500
  max_pages: 20
analysis:
